name: Q-SAT CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Pytest Test Suite
        run: |
          python -m pytest

  frontend-build:
    name: Frontend Build & Typecheck (Angular 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/qsat-dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend/qsat-dashboard
        run: npm ci

      - name: Build Angular Application
        working-directory: frontend/qsat-dashboard
        run: npm run build
